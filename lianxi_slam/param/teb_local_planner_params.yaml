TebLocalPlannerROS:
  odom_topic: odom
  map_frame: odom
  teb_autosize: True
  dt_ref: 0.3
  dt_hysteresis: 0.1
  max_samples: 500
  global_plan_overwrite_orientation: True
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.0
  feasibility_check_no_poses: 5

  max_vel_x: 0.6
  max_vel_x_backwards: 0.0
  max_vel_theta: 0.8
  acc_lim_x: 0.6
  acc_lim_theta: 0.6
  min_vel_x: 0.0
  min_vel_theta: -0.8
  min_in_place_vel_theta: 0.4
  escape_vel: -0.1
  footprint_model:
    type: "circular"
    radius: 0.12

  min_obstacle_dist: 0.13
  include_dynamic_obstacles: false
  dynamic_obstacle_inflation_dist: 0.12
  obstacle_cost_mult: 1.0
  obstacle_cost_exponent: 4.0

  weight_velocity: 1.0
  weight_acceleration: 1.0
  weight_optimaltime: 1.0
  weight_obstacle: 20.0
  weight_inflation: 0.1
  weight_dynamic_obstacle: 10.0

  weight_kinematics_forward_drive: 12.0
  weight_kinematics_turning_radius: 6.0

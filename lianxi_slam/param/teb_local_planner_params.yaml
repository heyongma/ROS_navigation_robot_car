TebLocalPlannerROS:
  odom_topic: odom
  map_frame: map
  teb_autosize: true
  dt_ref: 0.25
  dt_hysteresis: 0.08
  max_samples: 300
  enable_homotopy_class_planning: false
  global_plan_overwrite_orientation: true
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 0.8
  feasibility_check_no_poses: 5
  max_vel_x: 0.3
  max_vel_x_backwards: -0.15
  max_vel_theta: 0.9
  acc_lim_x: 0.25
  acc_lim_theta: 0.75
  min_vel_x: 0.01
  min_vel_theta: -0.65
  min_in_place_vel_theta: 0.25
  escape_vel: -0.1
  footprint_model:
    type: circular
    radius: 0.12
  min_obstacle_dist: 0.36
  include_dynamic_obstacles: true
  dynamic_obstacle_topic: obstacles
  dynamic_obstacle_inflation_dist: 0.36
  obstacle_cost_mult: 1.0
  obstacle_cost_exponent: 4.0
  weight_path: 5.0
  weight_viapoint: 10.0
  weight_shortest_path: 10.0
  weight_velocity: 1.2
  weight_acceleration: 1.0
  weight_optimaltime: 0.3
  weight_obstacle: 32.0
  weight_inflation: 0.2
  weight_dynamic_obstacle: 12.0
  weight_goal_point: 15.0
  weight_kinematics_forward_drive: 1.0
  weight_kinematics_turning_radius: 0.0

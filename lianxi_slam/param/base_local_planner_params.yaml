DWAPlannerROS:
  max_vel_x: 0.25
  min_vel_x: 0.0
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 0.6
  min_vel_theta: -0.6

  acc_lim_x: 0.6
  acc_lim_theta: 1.2

  sim_time: 1.5
  sim_granularity: 0.05
  vx_samples: 20
  vtheta_samples: 40

  path_distance_bias: 24.0
  goal_distance_bias: 20.0
  occdist_scale: 0.04
  dwa: true

  xy_goal_tolerance: 0.12
  yaw_goal_tolerance: 0.15
